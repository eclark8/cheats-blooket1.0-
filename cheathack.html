<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooket Cheats 1.0</title>
    <!-- Load Google Fonts: Inter for body, Titan One for bold headings -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Load Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
        }
        /* Custom Blooket-style dark background with a subtle grid pattern */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #292929; 
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(255, 255, 255, 0.08) 25%, rgba(255, 255, 255, 0.08) 26%, transparent 27%), 
                linear-gradient(90deg, transparent 24%, rgba(255, 255, 255, 0.08) 25%, rgba(255, 255, 255, 0.08) 26%, transparent 27%);
            background-size: 40px 40px;
            background-attachment: fixed;
        }
        .blooket-font {
            font-family: 'Titan One', sans-serif;
            letter-spacing: 0.05em;
        }
        /* Thick 3D bottom border typical of Blooket UI buttons */
        .blooket-btn-shadow {
            box-shadow: 0 6px 0 0 rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
        }
        .blooket-btn-shadow:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-between min-h-screen p-4 sm:p-8">


    <!-- Header Section -->
    <header class="w-full max-w-4xl text-center my-6">
        <h1 class="blooket-font text-4xl sm:text-6xl text-amber-400 drop-shadow-[0_4px_0_rgba(0,0,0,0.5)] mb-2">
            BLOOKET CHEATS 1.0
        </h1>
        <p class="text-gray-400 text-sm sm:text-base font-medium max-w-md mx-auto">
            Click any button below to instantly copy your desired script snippet to your clipboard.
        </p>
    </header>


    <!-- Main Content Grid -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 my-4">
        
        <!-- Category: Global / All Gamemodes -->
        <div class="bg-[#1f1f1f] rounded-2xl p-6 border-2 border-zinc-700 shadow-xl">
            <h2 class="blooket-font text-xl text-sky-400 mb-4 flex items-center gap-2">
                🌐 Global Hacks
            </h2>
            <div class="space-y-3">
                <button onclick="copyCheat('alert(\'All Blooks Unlocked!\');', this)" class="w-full text-left bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 px-4 rounded-xl blooket-btn-shadow flex justify-between items-center group">
                    <span>Unlock All Blooks</span>
                    <span class="text-xs bg-sky-700 px-2 py-1 rounded opacity-70 group-hover:opacity-100">Copy</span>
                </button>
                <button onclick="copyCheat('alert(\'Max Tokens Added!\');', this)" class="w-full text-left bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 px-4 rounded-xl blooket-btn-shadow flex justify-between items-center group">
                    <span>Add Max Daily Tokens</span>
                    <span class="text-xs bg-sky-700 px-2 py-1 rounded opacity-70 group-hover:opacity-100">Copy</span>
                </button>
            </div>
        </div>


        <!-- Category: Gold Quest -->
        <div class="bg-[#1f1f1f] rounded-2xl p-6 border-2 border-zinc-700 shadow-xl">
            <h2 class="blooket-font text-xl text-amber-500 mb-4 flex items-center gap-2">
                👑 Gold Quest
            </h2>
            <div class="space-y-3">
                <button onclick="copyCheat('alert(\'Infinite Gold Activated!\');', this)" class="w-full text-left bg-amber-500 hover:bg-amber-400 text-neutral-950 blooket-font py-3 px-4 rounded-xl blooket-btn-shadow flex justify-between items-center group">
                    <span>Infinite Gold</span>
                    <span class="text-xs bg-amber-700 text-white font-sans font-bold px-2 py-1 rounded opacity-70 group-hover:opacity-100">Copy</span>
                </button>
                <button onclick="copyCheat('alert(\'Chest Esp Enabled!\');', this)" class="w-full text-left bg-amber-500 hover:bg-amber-400 text-neutral-950 blooket-font py-3 px-4 rounded-xl blooket-btn-shadow flex justify-between items-center group">
                    <span>Chest ESP / Reveal</span>
                    <span class="text-xs bg-amber-700 text-white font-sans font-bold px-2 py-1 rounded opacity-70 group-hover:opacity-100">Copy</span>
                </button>
            </div>
        </div>


        <!-- Category: Crypto Hack -->
        <div class="bg-[#1f1f1f] rounded-2xl p-6 border-2 border-zinc-700 shadow-xl">
            <h2 class="blooket-font text-xl text-emerald-400 mb-4 flex items-center gap-2">
                💻 Crypto Hack
            </h2>
            <div class="space-y-3">
                <button onclick="copyCheat('alert(\'Auto-Hacking Password...\');', this)" class="w-full text-left bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl blooket-btn-shadow flex justify-between items-center group">
                    <span>Auto-Hack Passwords</span>
                    <span class="text-xs bg-emerald-800 px-2 py-1 rounded opacity-70 group-hover:opacity-100">Copy</span>
                </button>
            </div>
        </div>


        <!-- Category: Tower Defense -->
        <div class="bg-[#1f1f1f] rounded-2xl p-6 border-2 border-zinc-700 shadow-xl">
            <h2 class="blooket-font text-xl text-rose-400 mb-4 flex items-center gap-2">
                🛡️ Tower Defense
            </h2>
            <div class="space-y-3">
                <button onclick="copyCheat('alert(\'Maxing out stats...\');', this)" class="w-full text-left bg-rose-500 hover:bg-rose-400 text-white font-bold py-3 px-4 rounded-xl blooket-btn-shadow flex justify-between items-center group">
                    <span>Max Tower Stats</span>
                    <span class="text-xs bg-rose-700 px-2 py-1 rounded opacity-70 group-hover:opacity-100">Copy</span>
                </button>
            </div>
        </div>


    </main>


    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-zinc-900 border-2 border-emerald-500 text-emerald-400 px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 font-medium z-50 flex items-center gap-2">
        ✅ Script copied to clipboard successfully!
    </div>


    <!-- Footer Section -->
    <footer class="w-full max-w-4xl text-center text-xs text-zinc-500 mt-8 mb-4 border-t border-zinc-800 pt-4">
        <p>Blooket Cheats 1.0 &copy; 2026. Made for educational purposes only.</p>
    </footer>


    <!-- Interactive Copy Engine Script -->
    <script>
        function copyCheat(scriptText, buttonElement) {
            // Write script text to target keyboard clipboard
            navigator.clipboard.writeText(scriptText).then(() => {
                const toast = document.getElementById('toast');
                
                // Show notification toast visual
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
                
                // Hide toast window automatically after 2.5 seconds
                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2500);
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        }
    </script>
</body>
</html>
